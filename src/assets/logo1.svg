<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue background -->
  <rect width="600" height="600" fill="#001a4d" rx="80"/>
  
  <!-- ET Logo - Green -->
  <g transform="translate(150, 100)">
    <!-- E shape -->
    <rect x="0" y="0" width="80" height="160" fill="#00d966"/>
    <rect x="0" y="0" width="120" height="30" fill="#001a4d"/>
    <rect x="0" y="65" width="100" height="30" fill="#001a4d"/>
    <rect x="0" y="130" width="120" height="30" fill="#001a4d"/>
    
    <!-- T shape -->
    <rect x="150" y="0" width="120" height="30" fill="#00d966"/>
    <rect x="200" y="30" width="30" height="130" fill="#00d966"/>
  </g>
  
  <!-- Text: ECOLES -->
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">ECOLES</text>
  
  <!-- Text: TRACK with green underline -->
  <text x="300" y="480" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00d966" text-anchor="middle">TRACK</text>
  
  <!-- Decorative line -->
  <line x1="150" y1="510" x2="450" y2="510" stroke="#00d966" stroke-width="3"/>
</svg>